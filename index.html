<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>asymptos</title>
<meta name="description" content="asymptos">
<style>
:root {
  --paper: #f2f4f6;
  --ink: #18202a;
  --muted: #5d6a77;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #141a21;
    --ink: #e4e9ee;
    --muted: #93a0ad;
  }
}
:root[data-theme="dark"] {
  --paper: #141a21;
  --ink: #e4e9ee;
  --muted: #93a0ad;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  min-height: 100vh;
  background: var(--paper);
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
  line-height: 1.6;
}
.wrap { max-width: 640px; margin: 0 auto; padding: 64px 16px 48px; }

/* 渐近线：名字的由来，也是页面唯一的装饰 */
.mark { display: block; width: 100%; max-width: 360px; height: auto; margin: 0 0 18px; color: var(--muted); }
.mark .curve { color: var(--ink); }
h1 {
  display: inline-block;
  margin: 0;
  font-size: 34px;
  font-weight: 650;
  letter-spacing: -0.01em;
  cursor: default;
  user-select: none;
  -webkit-user-select: none;
  touch-action: manipulation;
}
.intro { margin: 6px 0 0; color: var(--muted); font-size: 15px; }

@media (max-width: 420px) {
  .wrap { padding-top: 40px; }
}
</style>
</head>
<body>
<main class="wrap">
  <svg class="mark" viewBox="0 0 360 60" aria-hidden="true">
    <line x1="0" y1="8" x2="360" y2="8" stroke="currentColor" stroke-width="1" stroke-dasharray="3 4"/>
    <path class="curve" d="M8 56 C 30 20, 80 12, 360 8.6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
  </svg>
  <h1 id="brand">asymptos</h1>
  <p class="intro">一些自己做着玩的小东西。</p>
</main>

<script>
(function () {
  var brand = document.getElementById('brand');
  var count = 0;
  var timer = null;

  function reset() {
    count = 0;
    if (timer) {
      clearTimeout(timer);
      timer = null;
    }
  }

  brand.addEventListener('click', function () {
    count += 1;
    if (timer) clearTimeout(timer);
    if (count >= 3) {
      reset();
      window.location.href = 'https://vps.asymptos.com/';
      return;
    }
    timer = setTimeout(reset, 1200);
  });

  document.addEventListener('click', function (e) {
    if (e.target !== brand) reset();
  });
})();
</script>
</body>
</html>
